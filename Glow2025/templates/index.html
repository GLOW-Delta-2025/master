<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>EOT Web UI</title>
<style>
body { font-family: Arial, sans-serif; margin: 20px; background:#f9f9f9; }
h1 { text-align: center; }
h2 { margin-top: 30px; }
section { background: #fff; padding: 15px; margin-bottom: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);}
button { margin: 2px; padding: 5px 10px; cursor:pointer; }
input, select { padding: 4px; margin: 2px; }
table { border-collapse: collapse; width: 100%; }
th, td { border: 1px solid #ccc; padding: 6px; text-align: left; }
pre { background:#eee; padding:10px; border-radius:6px; overflow-x:auto; }
#pendingLogs { max-height:200px; overflow-y:auto; background:#f4f4f4; padding:10px; border-radius:6px; }
</style>
</head>
<body>

<h1>EOT Web UI</h1>

<section>
<h2>Live Status & Logs</h2>
<button onclick="fetchStatus()">Refresh</button>
<button onclick="resetShow()">Reset Show</button>
<div id="liveStatus">loading…</div>
<div id="healthStatus">loading health…</div>
<div id="pendingLogs">loading logs…</div>
</section>

<section>
<h2>Manual Peak</h2>
<div id="manualPeaks"></div>
</section>

<section>
<h2>Runtime Controls</h2>
<label>show_color_arm (0-255)</label>
<input type="number" id="show_color_arm" min="0" max="255">
<label>show_color_center (#RRGGBB)</label>
<input type="text" id="show_color_center" maxlength="7">
<button onclick="applyColor()">Apply Color</button>
</section>

<section>
<h2>Load / Save Config</h2>
<button onclick="loadConfig()">Load saved config</button>
<button onclick="saveConfig(true)">Save editable config to disk</button>
</section>

<section>
<h2>Climax & Keepalive</h2>
<label>Climax timeout (s)</label>
<input type="number" id="climax_timeout">
<button onclick="setClimax()">Set</button>
<button onclick="setKeepalive(30)">Set Keepalive 30s</button>
<button onclick="setKeepalive(60)">Set Keepalive 60s</button>
</section>

<section>
<h2>Editable Config</h2>
<form id="editableConfigForm">
<table id="configTable">
<thead><tr><th>Key</th><th>Value</th></tr></thead>
<tbody></tbody>
</table>
<button type="button" onclick="applyConfig(false)">Apply changes</button>
<button type="button" onclick="applyConfig(true)">Apply + Save</button>
</form>
</section>

<section>
<h2>Audio Processor</h2>
<label>Device ID:</label><input type="text" id="audio_device"><br>
<label>Channels (e.g., 1,2):</label><input type="text" id="audio_channels"><br>
<label>Names (comma-separated):</label><input type="text" id="audio_names"><br>
<label>Threshold dB:</label><input type="number" id="audio_threshold"><br>
<label>Alpha Rise:</label><input type="number" id="audio_alpha_rise"><br>
<label>Alpha Decay:</label><input type="number" id="audio_alpha_decay"><br>
<button onclick="audioStart()">Start</button>
<button onclick="audioStop()">Stop</button>
<button onclick="audioApplyConfig()">Apply Config</button>
<div id="audioStatus">Status: loading…</div>
</section>

<script>
async function fetchStatus() {
    try {
        let resp = await fetch("/api/config");
        let cfg = await resp.json();

        document.getElementById("liveStatus").innerHTML = "<pre>" + JSON.stringify(cfg.runtime,null,2) + "</pre>";

        // Health display
        let healthHtml = "<pre>";
        if(cfg.runtime && cfg.runtime.health){
            for(let dev in cfg.runtime.health){
                let h = cfg.runtime.health[dev];
                healthHtml += `${dev}: ${h.online?"ONLINE":"OFFLINE"}  failures=${h.failures}\n`;
            }
        }
        healthHtml += "</pre>";
        document.getElementById("healthStatus").innerHTML = healthHtml;

        // Pending logs
        document.getElementById("pendingLogs").innerHTML = "<pre>"+JSON.stringify(cfg.pending_logs||[],null,2)+"</pre>";

        // Manual peaks
        let peaksDiv = document.getElementById("manualPeaks");
        peaksDiv.innerHTML = "";
        let arms = cfg.NUM_ARMS || 5;
        for(let i=1;i<=arms;i++){
            let btn = document.createElement("button");
            btn.innerText = "Trigger Peak ARM"+i;
            btn.onclick = ()=>triggerPeak(i);
            peaksDiv.appendChild(btn);
        }

        // Editable config table
        let tbody = document.querySelector("#configTable tbody");
        tbody.innerHTML = "";
        for(let k in cfg){
            if(k==="runtime" || k==="pending_logs") continue;
            let tr = document.createElement("tr");
            let tdKey = document.createElement("td"); tdKey.innerText = k;
            let tdVal = document.createElement("td");
            let inp = document.createElement("input");
            inp.value = cfg[k]; inp.id = "cfg_"+k;
            tdVal.appendChild(inp);
            tr.appendChild(tdKey); tr.appendChild(tdVal);
            tbody.appendChild(tr);
        }

        // Runtime color fields
        document.getElementById("show_color_arm").value = cfg.UPDATE_SHOW_COLOR_ARM;
        document.getElementById("show_color_center").value = cfg.UPDATE_SHOW_COLOR_CENTER;
        document.getElementById("climax_timeout").value = cfg.CLIMAX_TIMEOUT_SECONDS;

    } catch(e){ console.error(e); }
}

async function triggerPeak(arm){ await fetch("/api/action/trigger_peak",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({arm})}); }
async function resetShow(){ await fetch("/api/action/reset_show",{method:"POST"}); }
async function applyColor(){
    let arm = document.getElementById("show_color_arm").value;
    let center = document.getElementById("show_color_center").value;
    await fetch("/api/action/set_color",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({arm_value:arm,center_hex:center})});
}
async function loadConfig(){ await fetchStatus(); }
async function saveConfig(save=true){
    let payload = {};
    document.querySelectorAll("#configTable tbody input").forEach(inp=>{let k=inp.id.replace("cfg_","");payload[k]=inp.value;});
    await fetch("/api/config?save="+save,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
    await fetchStatus();
}
async function applyConfig(save=false){ await saveConfig(save); }
async function setClimax(){
    let val = document.getElementById("climax_timeout").value;
    await fetch("/api/config",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({CLIMAX_TIMEOUT_SECONDS:val})});
}
async function setKeepalive(val){ await fetch("/api/config",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({DEFAULT_KEEPALIVE_INTERVAL:val})}); }

// Audio
async function audioStart(){ await fetch("/api/audio/start",{method:"POST"}); updateAudioStatus(); }
async function audioStop(){ await fetch("/api/audio/stop",{method:"POST"}); updateAudioStatus(); }
async function audioApplyConfig(){ alert("Audio config apply not yet implemented"); }
async function updateAudioStatus(){
    let resp = await fetch("/api/audio/status"); let d = await resp.json();
    document.getElementById("audioStatus").innerText = "Status: "+JSON.stringify(d,null,2);
}

// Auto-refresh
setInterval(fetchStatus,2000);
setInterval(updateAudioStatus,2000);
fetchStatus();
updateAudioStatus();
</script>

</body>
</html>
