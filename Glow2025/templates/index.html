<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>EOT Web UI — Live Status</title>
<style>
body { font-family: Arial, sans-serif; margin: 20px; background: #121212; color: #faf5f5; }
h2 { margin-top: 30px; color: #ffffff; }
section { background: #1c1c1c; padding: 15px; margin-bottom: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.5); }
button { margin: 2px; padding: 5px 10px; background: #2a2a2a; color: #e0e0e0; border: 1px solid #444; border-radius: 4px; cursor: pointer; }
button:hover { background: #3a3a3a; }
table { border-collapse: collapse; width: 100%; }
th, td { border: 1px solid #333; padding: 6px; text-align: left; }
th { background: #222; color: #ccc; }
tr:nth-child(even) { background: #1a1a1a; }
tr:nth-child(odd) { background: #151515; }
tr.green { background-color: #0d3b23 !important; color: #9ddca4 !important; }
tr.red { background-color: #3b0d0d !important; color: #e49d9d !important; }
nav a { color: #8cbfff; margin-right: 15px; text-decoration: none; }
nav a:hover { text-decoration: underline; }
</style>
</head>
<body>
<h1>EOT Live Status</h1>
<nav>
  <a href="/config/">Config</a>
  <a href="/audio/">Audio config</a>
</nav>

<section>
<h2>Live Status & Logs</h2>
<button onclick="fetchStatus()">Refresh</button>
<button onclick="resetShow()">Reset Show</button>
<div id="liveStatus">loading…</div>
<div id="healthStatus">loading…</div>
</section>

<section>
<h2>Manual Peak</h2>
<div id="manualPeaks"></div>
</section>

<script>
// --- Fetch runtime status from BlueprintConfig ---
async function fetchStatus() {
  try {
    const res = await fetch("/config/api/config");  // updated URL
    const cfg = await res.json();

    // --- Runtime info ---
    let runtime = cfg.runtime || {};
    let text = "";
    Object.entries(runtime).forEach(([k,v]) => {
      if (k === "health") return;
      text += `${k}: ${v}\n`;
    });
    document.getElementById("liveStatus").innerText = text;

    // --- Health table ---
    const tbody = Object.entries(runtime.health || {}).map(([dev,h]) => {
      const rowClass = h.online ? "green" : "red";
      const age = ((Date.now()/1000) - h.last_seen).toFixed(1);
      return `<tr class="${rowClass}">
                <td>${dev}</td>
                <td>${h.online ? "ONLINE" : "OFFLINE"}</td>
                <td>${h.failures}</td>
                <td>${age}s ago</td>
              </tr>`;
    }).join("");
    document.getElementById("healthStatus").innerHTML = `
      <table>
        <thead><tr><th>Device</th><th>Status</th><th>Failures</th><th>Last Seen</th></tr></thead>
        <tbody>${tbody}</tbody>
      </table>`;

    // --- Manual Peak Buttons ---
    const arms = cfg.NUM_ARMS || 5;
    const div = document.getElementById("manualPeaks");
    div.innerHTML = "";
    for (let i = 1; i <= arms; i++) {
      const btn = document.createElement("button");
      btn.textContent = "Trigger Peak ARM" + i;
      btn.onclick = () => triggerPeak(i);
      div.appendChild(btn);
    }
  } catch (e) {
    console.error("fetchStatus error", e);
  }
}

// --- Manual peak / reset ---
async function triggerPeak(arm) {
  await fetch("/api/action/trigger_peak", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({arm})
  });
}
async function resetShow() {
  await fetch("/api/action/reset_show", {method: "POST"});
}

// --- Auto-refresh ---
setInterval(fetchStatus, 3000);
fetchStatus();
</script>
</body>
</html>
