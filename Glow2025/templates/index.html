<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>EOT Web UI</title>

<style>
body {
  font-family: Arial, sans-serif;
  margin: 20px;
  background: #121212;
  color: #faf5f5;
}

h2 {
  margin-top: 30px;
  color: #ffffff;
}

section {
  background: #1c1c1c;
  padding: 15px;
  margin-bottom: 20px;
  border-radius: 8px;
  box-shadow: 0 2px 5px rgba(0,0,0,0.5);
}

button {
  margin: 2px;
  padding: 5px 10px;
  background: #2a2a2a;
  color: #e0e0e0;
  border: 1px solid #444;
  border-radius: 4px;
  cursor: pointer;
}

button:hover {
  background: #3a3a3a;
}

input, select {
  padding: 4px;
  margin: 2px;
  background: #222;
  color: #f0f0f0;
  border: 1px solid #555;
  border-radius: 4px;
}

table {
  border-collapse: collapse;
  width: 100%;
}

th, td {
  border: 1px solid #333;
  padding: 6px;
  text-align: left;
}

th {
  background: #222;
  color: #ccc;
}

tr:nth-child(even) {
  background: #1a1a1a;
}

tr:nth-child(odd) {
  background: #151515;
}

/* Darker, muted green and red tones */
tr.green {
  background-color: #0d3b23 !important;
  color: #9ddca4 !important;
}

tr.red {
  background-color: #3b0d0d !important;
  color: #e49d9d !important;
}


#pendingLogs {
  max-height: 150px;
  overflow-y: auto;
  background: #181818;
  padding: 5px;
  border-radius: 5px;
  margin-top: 5px;
  font-family: monospace;
  font-size: 12px;
  color: #b0b0b0;
  border: 1px solid #333;
}
</style>


</head>
<body>

<h1>EOT Web UI</h1>

<section>
<h2>Live Status & Logs</h2>
<button onclick="fetchStatus()">Refresh</button>
<button onclick="resetShow()">Reset Show</button>
<div id="liveStatus">loading…</div>
<div id="healthStatus">loading…</div>
</section>

<section>
<h2>Manual Peak</h2>
<div id="manualPeaks"></div>
</section>

<section>
<h2>Runtime Controls</h2>
<label>show_color_arm (0-255)</label>
<input type="number" id="show_color_arm" min="0" max="255">
<label>show_color_center (#RRGGBB)</label>
<input type="text" id="show_color_center" maxlength="7">
<button onclick="applyColor()">Apply Color</button>
</section>

<section>
<h2>Load / Save Config</h2>
<button onclick="loadConfig()">Load saved config</button>
<button onclick="saveConfig(true)">Save editable config to disk</button>
</section>

<section>
<h2>Climax & Keepalive</h2>
<label>Climax timeout (s)</label>
<input type="number" id="climax_timeout">
<button onclick="setClimax()">Set</button>
<button onclick="setKeepalive(30)">Set Keepalive 30s</button>
<button onclick="setKeepalive(60)">Set Keepalive 60s</button>
</section>

<section>
<h2>Editable Config</h2>
<form id="editableConfigForm">
<table id="configTable">
<thead><tr><th>Key</th><th>Value</th></tr></thead>
<tbody></tbody>
</table>
<button type="button" onclick="applyConfig(false)">Apply changes</button>
<button type="button" onclick="applyConfig(true)">Apply + Save</button>
</form>
</section>

<script>
// --- Live Status & Health ---
async function fetchStatus() {
    try {
        let resp = await fetch("/api/config");
        let cfg = await resp.json();

        // --- Runtime (without health) in key:value format ---
        let runtimeCopy = {...cfg.runtime};
        delete runtimeCopy.health;

        let runtimeText = "";
        Object.entries(runtimeCopy).forEach(([key, value]) => {
            runtimeText += `${key.padEnd(20)}: ${value}\n`;
        });
        document.getElementById("liveStatus").innerText = runtimeText;

        // --- Health Table ---
        let healthHtml = `
        <table>
            <thead>
            <tr><th>Device</th><th>Status</th><th>Failures</th><th>Last Seen</th></tr>
            </thead>
            <tbody>
        `;

        if (cfg.runtime && cfg.runtime.health) {
        Object.entries(cfg.runtime.health).forEach(([dev, h]) => {
            let rowClass = h.online ? "green" : "red";
            let age = ((Date.now() / 1000) - h.last_seen).toFixed(1);
            healthHtml += `
            <tr class="${rowClass}">
                <td>${dev}</td>
                <td>${h.online ? "ONLINE" : "OFFLINE"}</td>
                <td>${h.failures}</td>
                <td>${age}s ago</td>
            </tr>
            `;
        });
        }

        healthHtml += "</tbody></table>";
        document.getElementById("healthStatus").innerHTML = healthHtml;

        // --- Manual Peaks ---
        const peaksDiv = document.getElementById("manualPeaks");
        peaksDiv.innerHTML = "";
        const arms = cfg.NUM_ARMS || 5;
        for(let i=1; i<=arms; i++){
            let btn = document.createElement("button");
            btn.innerText = `Trigger Peak ARM${i}`;
            btn.onclick = () => triggerPeak(i);
            peaksDiv.appendChild(btn);
        }

        // --- Editable Config Table ---
        const tbody = document.querySelector("#configTable tbody");
        tbody.innerHTML = "";
        Object.keys(cfg).forEach(k => {
            if(k === "runtime") return;
            let tr = document.createElement("tr");
            let tdKey = document.createElement("td"); tdKey.innerText = k;
            let tdVal = document.createElement("td");
            let inp = document.createElement("input");
            inp.value = cfg[k] ?? "";
            inp.id = "cfg_" + k;
            tdVal.appendChild(inp);
            tr.appendChild(tdKey); tr.appendChild(tdVal);
            tbody.appendChild(tr);
        });

        // --- Runtime color & climax fields ---
        document.getElementById("show_color_arm").value = cfg.UPDATE_SHOW_COLOR_ARM ?? "";
        document.getElementById("show_color_center").value = cfg.UPDATE_SHOW_COLOR_CENTER ?? "";
        document.getElementById("climax_timeout").value = cfg.CLIMAX_TIMEOUT_SECONDS ?? "";

    } catch(e) {
        console.error("Failed to fetch status:", e);
        document.getElementById("liveStatus").innerText = "Error loading runtime.";
        document.getElementById("healthStatus").innerText = "Error loading health.";
    }
}



// --- Manual peak & show reset ---
async function triggerPeak(arm){ await fetch("/api/action/trigger_peak",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({arm})}); }
async function resetShow(){ await fetch("/api/action/reset_show",{method:"POST"}); }

// --- Runtime color ---
async function applyColor(){
    let arm = document.getElementById("show_color_arm").value;
    let center = document.getElementById("show_color_center").value;
    await fetch("/api/action/set_color",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({arm_value:arm,center_hex:center})});
}

// --- Config load/save ---
async function loadConfig(){ await fetchStatus(); }
async function saveConfig(save=true){
    let payload = {};
    document.querySelectorAll("#configTable tbody input").forEach(inp=>{
        let k=inp.id.replace("cfg_","");
        payload[k]=inp.value;
    });
    await fetch("/api/config?save="+save,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
    await fetchStatus();
}
async function applyConfig(save=false){ await saveConfig(save); }

// --- Climax & Keepalive ---
async function setClimax(){
    let val = document.getElementById("climax_timeout").value;
    await fetch("/api/config",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({CLIMAX_TIMEOUT_SECONDS:val})});
}
async function setKeepalive(val){ await fetch("/api/config",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({DEFAULT_KEEPALIVE_INTERVAL:val})}); }

// --- Auto-refresh ---
setInterval(fetchStatus,2000);
setInterval(updateAudioStatus,2000);
fetchStatus();
updateAudioStatus();
</script>

</body>
</html>
