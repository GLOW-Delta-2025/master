<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>EOT Web UI — Config</title>
<style>
body { font-family: Arial,sans-serif; margin: 20px; background: #121212; color: #faf5f5; }
h2 { margin-top: 30px; color: #fff; }
section { background: #1c1c1c; padding: 15px; margin-bottom: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.5);}
button { margin: 2px; padding: 5px 10px; background: #2a2a2a; color: #e0e0e0; border: 1px solid #444; border-radius: 4px; cursor:pointer;}
button:hover { background: #3a3a3a; }
input { padding: 4px; margin: 2px; background: #222; color: #f0f0f0; border: 1px solid #555; border-radius:4px;}
table { border-collapse: collapse; width: 100%; }
th, td { border: 1px solid #333; padding:6px; text-align:left; }
th { background:#222; color:#ccc; }
tr:nth-child(even){background:#1a1a1a;} tr:nth-child(odd){background:#151515;}
nav a { color:#8cbfff; margin-right:15px; text-decoration:none; }
nav a:hover{text-decoration:underline;}
</style>
</head>
<body>
<h1>EOT Config</h1>
<nav>
  <a href="/">Live Status</a>
  <a href="/audio/">Audio config</a>
</nav>

<section>
<h2>Runtime Controls</h2>
<label>show_color_arm (0–255):</label>
<input type="number" id="show_color_arm" min="0" max="255">
<label>show_color_center (#RRGGBB):</label>
<input type="text" id="show_color_center" maxlength="7">
<button onclick="applyColor()">Apply Color</button>
</section>

<section>
<h2>Climax & Keepalive</h2>
<label>Climax timeout (s):</label>
<input type="number" id="climax_timeout">
<button onclick="setClimax()">Set</button>
<button onclick="setKeepalive(30)">Keepalive 30s</button>
<button onclick="setKeepalive(60)">Keepalive 60s</button>
</section>

<section>
<h2>Load / Save Config</h2>
<button onclick="loadConfig()">Load saved config</button>
<button onclick="saveConfig(true)">Save editable config</button>
</section>

<section>
<h2>Editable Config</h2>
<form id="editableConfigForm">
<table id="configTable">
<thead><tr><th>Key</th><th>Value</th></tr></thead>
<tbody></tbody>
</table>
<button type="button" onclick="applyConfig(false)">Apply changes</button>
<button type="button" onclick="applyConfig(true)">Apply + Save</button>
</form>
</section>

<script>
const DEFAULTS = {
  "ACK_TIMEOUT": "0.75",
  "ARM_SPEED_MAX": "10",
  "ARM_SPEED_MIN": "2",
  "ARRIVAL_TIMEOUT": "15",
  "ARRIVAL_WARN_AFTER": "8",
  "CENTER_SPEED_MAX": "25",
  "CENTER_SPEED_MIN": "8",
  "CLIMAX_TIMEOUT_SECONDS": "30",
  "DEBUG_FRAMES": "False",
  "DEFAULT_KEEPALIVE_INTERVAL": "10",
  "HEALTH_FAIL_THRESHOLD": "3",
  "MAX_BRIGHTNESS": "255",
  "MAX_SEND_RETRIES": "3",
  "MAX_STARS_FOR_CLIMAX": "25",
  "NUM_ARMS": "5",
  "PEAK_TIMEOUT": "10",
  "SERIAL_BAUD": "115200",
  "SERIAL_PORT": "/dev/tty.usbmodem83171401",
  "STAR_SEND_TIME": "20",
  "UPDATE_SHOW_COLOR_ARM": "128",
  "UPDATE_SHOW_COLOR_CENTER": "#808080",
  "UPDATE_STEP": "50",
  "WARN_THROTTLE": "2"
};

async function fetchConfig() {
  const res = await fetch("/config/api/config");
  const cfg = await res.json();

  // merge with defaults
  const merged = {...DEFAULTS, ...cfg};

  const tbody = document.querySelector("#configTable tbody");
  tbody.innerHTML = "";
  Object.keys(merged).forEach(k => {
    if (["UPDATE_SHOW_COLOR_ARM","UPDATE_SHOW_COLOR_CENTER","CLIMAX_TIMEOUT_SECONDS","DEFAULT_KEEPALIVE_INTERVAL"].includes(k)) return;
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${k}</td>
      <td><input id="cfg_${k}" value="${merged[k] ?? ""}"></td>
    `;
    tbody.appendChild(tr);
  });

  document.getElementById("show_color_arm").value = merged.UPDATE_SHOW_COLOR_ARM;
  document.getElementById("show_color_center").value = merged.UPDATE_SHOW_COLOR_CENTER;
  document.getElementById("climax_timeout").value = merged.CLIMAX_TIMEOUT_SECONDS;
}

async function applyColor() {
  const arm = document.getElementById("show_color_arm").value;
  const center = document.getElementById("show_color_center").value;
  await fetch("/config/api/config", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({UPDATE_SHOW_COLOR_ARM: arm, UPDATE_SHOW_COLOR_CENTER: center})
  });
}

async function saveConfig(save=true){
  const payload = {};
  document.querySelectorAll("#configTable input").forEach(inp=>{
    payload[inp.id.replace("cfg_","")] = inp.value;
  });
  await fetch(`/config/api/config`,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify(payload)
  });
}

async function applyConfig(save=false){ await saveConfig(save); }
async function loadConfig(){ await fetchConfig(); }
async function setClimax(){
  const val = document.getElementById("climax_timeout").value;
  await fetch("/config/api/config",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({CLIMAX_TIMEOUT_SECONDS: val})});
}
async function setKeepalive(val){
  await fetch("/config/api/config",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({DEFAULT_KEEPALIVE_INTERVAL: val})});
}

// initial load
fetchConfig();
</script>
</body>
</html>
